<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Your Profile</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive;
            background: linear-gradient(135deg, #ff6b6b, #4ecdc4);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            color: #ff6b6b;
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        .form-group {
            margin: 20px 0;
        }
        input, select {
            padding: 15px;
            border: 2px solid #4ecdc4;
            border-radius: 10px;
            font-size: 1.1em;
            width: 80%;
        }
        .avatar-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 20px 0;
        }
        .avatar-option {
            background: #f8f8f8;
            border: 3px solid transparent;
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            font-size: 3em;
            transition: all 0.2s;
        }
        .avatar-option:hover,
        .avatar-option.selected {
            border-color: #ff6b6b;
            transform: scale(1.05);
        }
        .btn {
            background: #4ecdc4;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 15px;
            font-size: 1.2em;
            cursor: pointer;
            margin: 10px;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Create Your Profile 🎮</h1>
        
        <form id="setupForm">
            <div class="form-group">
                <label for="nickname">What's your name?</label>
                <input type="text" id="nickname" name="nickname" placeholder="Enter your nickname" required>
            </div>
            
            <div class="form-group">
                <label>Choose your buddy!</label>
                <div class="avatar-grid">
                    <div class="avatar-option" data-avatar="cat">🐱</div>
                    <div class="avatar-option" data-avatar="dog">🐶</div>
                    <div class="avatar-option" data-avatar="rabbit">🐰</div>
                    <div class="avatar-option" data-avatar="bear">🐻</div>
                    <div class="avatar-option" data-avatar="fox">🦊</div>
                    <div class="avatar-option" data-avatar="panda">🐼</div>
                </div>
            </div>
            
            <div class="form-group">
                <label for="language">Choose your language:</label>
                <select id="language" name="language">
                    <option value="english">English</option>
                    <option value="hindi">हिंदी (Hindi)</option>
                    <option value="kannada">ಕನ್ನಡ (Kannada)</option>
                    <option value="telugu">తెలుగు (Telugu)</option>
                </select>
            </div>
            
            <button type="submit" class="btn">🚀 Start Adventure</button>
        </form>
    </div>

    <script>
        let selectedAvatar = null;
        
        document.querySelectorAll('.avatar-option').forEach(option => {
            option.addEventListener('click', function() {
                document.querySelectorAll('.avatar-option').forEach(opt => opt.classList.remove('selected'));
                this.classList.add('selected');
                selectedAvatar = this.dataset.avatar;
            });
        });
        
        document.getElementById('setupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const nickname = document.getElementById('nickname').value;
            const language = document.getElementById('language').value;
            
            if (!nickname || !selectedAvatar) {
                alert('Please fill in your name and choose a buddy!');
                return;
            }
            
            try {
                const response = await fetch('/setup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        nickname: nickname,
                        avatar: selectedAvatar,
                        language: language
                    })
                });
                
                const result = await response.json();
                if (result.success) {
                    window.location.href = '/dashboard';
                } else {
                    alert('Something went wrong. Please try again!');
                }
            } catch (error) {
                alert('Something went wrong. Please try again!');
            }
        });
    </script>
</body>
</html>
